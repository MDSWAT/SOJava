services:
  db:
    image: mysql:8.0
    container_name: sidesi_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sidesi_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sidesi_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: sidesi_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - sidesi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  auth_proxy:
    build:
      context: ./auth_proxy
      dockerfile: Dockerfile
    container_name: sidesi_auth_proxy
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - ./auth_proxy/.env
    networks:
      - sidesi_net

volumes:
  mysql_data:

networks:
  sidesi_net:
    driver: bridge
